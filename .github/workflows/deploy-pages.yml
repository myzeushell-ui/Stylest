# Деплой фронтенда «Образ» (apps/web) на GitHub Pages.
# Публичный URL: https://myzeushell-ui.github.io/Stylest/
#
# ВАЖНО: Pages — это статика, без нашего бэкенда. Локально-первые модули
# (профиль, гардероб, аналитика, Style DNA, Body/Beauty DNA) работают полностью;
# AI-чат и мок-каталог требуют бэкенда и в этой демо-версии недоступны.
name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - claude/obraz-ai-style-mvp-F0llV
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускаем параллельные деплои.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web (с base = /Stylest/)
        env:
          VITE_BASE: /Stylest/
        run: npm run build --workspace apps/web

      - name: SPA-fallback для Pages (404.html = index.html)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
