# Авто-деплой веб-версии «Образ» на GitHub Pages.
# Публичный URL: https://myzeushell-ui.github.io/Stylest/
# configure-pages с enablement:true сам включает Pages и ставит источник =
# GitHub Actions — в идеале без ручных настроек в репозитории.
name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - claude/obraz-ai-style-mvp-F0llV
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web (base = /Stylest/)
        env:
          VITE_BASE: /Stylest/
        run: npm run build --workspace apps/web
      - name: SPA-fallback (404 = index)
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
